# Theme for the Beall's List check app.
#
# Colours are taken from the Tailwind CSS palette (https://tailwindcss.com/docs/colors):
# an established, systematically generated, contrast-tested ramp, rather than
# hand-picked hexes.  Neutrals are *slate*; the accent is *blue*.  The app's own
# stylesheet (ui/app.py, _TOKENS) restates the same values as CSS variables and
# uses nothing outside them, so the widgets Streamlit paints and the ones the app
# paints belong to one palette.
#
# The accent is blue rather than Streamlit's default red (#FF4B4B), and that is a
# correctness point rather than a preference: red is a *verdict* in this tool.
# `on_list` — the venue appears on Beall's List — is red in the workbook, in the
# status chips and in the result preview.  An accent that was also red made the
# page read as "flagged" in places where it only meant "selected".  Blue carries
# no verdict here, so the two can never be confused.
#
# Both themes are declared, so the app keeps following the browser's
# `prefers-color-scheme` — the same signal the app's CSS variables key off.  A
# `[theme]` block with no `[theme.dark]` would pin the app to light.

[theme]
base                      = "light"
primaryColor              = "#3B82F6"   # blue-500
backgroundColor           = "#FFFFFF"
secondaryBackgroundColor  = "#F1F5F9"   # slate-100
textColor                 = "#1E293B"   # slate-800
linkColor                 = "#1D4ED8"   # blue-700
borderColor               = "#E2E8F0"   # slate-200
baseRadius                = "medium"

[theme.dark]
# The same blue-500 as the light theme, deliberately.  ui/app.py draws the step
# badges and the selected-row tint from one opaque accent that works on either
# background, and overrides the filled buttons' label to slate-900 for a 4.8:1
# ratio; a different primary here would put that override on the wrong blue.
primaryColor              = "#3B82F6"   # blue-500
backgroundColor           = "#0F172A"   # slate-900
secondaryBackgroundColor  = "#1E293B"   # slate-800
textColor                 = "#F1F5F9"   # slate-100
linkColor                 = "#93C5FD"   # blue-300
borderColor               = "#334155"   # slate-700
baseRadius                = "medium"

# The Deploy button offers to publish to Streamlit Community Cloud, which is
# meaningless for a local, single-user tool that reads the machine's .env and
# writes to the repository.  "viewer" drops it and the other developer actions
# (Rerun, Clear cache, Record a screencast) while keeping the menu itself, which
# is where Settings -- and with it the light/dark override -- lives.  "minimal"
# would have removed the menu too.
[client]
toolbarMode = "viewer"

# Serve ui/static/ at /app/static/.  The tutorial's screenshots are rendered as
# plain <img> tags rather than through st.image, which re-encodes them as JPEG --
# visibly lossy on a screenshot of text -- and offers no way to click through to
# the full-size original.
[server]
enableStaticServing = true
